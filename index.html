<!DOCTYPE html>
<html lang="en">
<head>
	<title>Mongraph</title>
	<link rel="stylesheet" href="/static/app.css" />
	<link rel="stylesheet" href="/static/mermaid.css" />
	<script src="/static/mermaid.min.js"></script>
	<script type="module" src="/static/app.js"></script>
</head>

<body>
	<header>
		<h1><!-- Project name --></h1>

		<div class="history_box">
			<table id="history" aria-label="History" class="history">
			<tr>
				<th>Timestamp</th>
				<th>Node</th>
				<th>Message</th>
			</tr>
			</table>
		</div>

		<nav id="breadcrumb" aria-label="Breadcrumb" class="breadcrumb">
			<ol></ol>
		</nav>
	</header>

	<pre id="graph" aria-label="Graph" class="mermaid"></pre>
</body>
</html>
