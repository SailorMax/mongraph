<!DOCTYPE html>
<html lang="en">
<head>
	<title>Mongraph</title>
	<link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
	<link rel="stylesheet" href="/static/app.css" />
	<link rel="stylesheet" href="/static/mermaid.css" />
	<script src="/static/mermaid.min.js"></script>
	<script type="module" src="/static/app.js"></script>
</head>

<body>
	<header>
		<div class="centered">
			<div class="refresh_status">
				<div id="refresh_control"><span id="timer">5</span> <span id="label">second(s) until refresh</span> <button>stop</button></div>
				<span id="loader"></span>
			</div>
			<h1>&nbsp;<!-- space to do not change the page width while loading. After page loaded here is Project name --></h1>

			<div class="history_box">
				<table id="history" aria-label="History" class="history">
				<thead>
				<tr>
					<th>Timestamp</th>
					<th>
						Node
						<input id="history-filter" type="search" spellcheck="false" autocomplete="off" placeholder="filter the list" />
					</th>
					<th>
						Message
						<button id='history-resizer'>↕</button>
					</th>
				</tr>
				</thead>
				<tbody>
				</tbody>
				</table>
			</div>

			<nav id="breadcrumb" aria-label="Breadcrumb" class="breadcrumb">
				<ol></ol>
			</nav>
		</div>
	</header>
	<dialog id="msgRowDetails" closedby="any">
		<table>
		<tr><th>Node</th><td id='msgNode'></td></tr>
		<tr><th>Details</th><td id='msgNodeDetails'></td></tr>
		<tr><th>Timestamp</th><td id='msgStatusDate'></td></tr>
		<tr><th>Status</th><td id='msgStatus'></td></tr>
		<tr><th>Message</th><td id='msgStatusDetails'></td></tr>
		</table>
		<button id="msgRowDetailsClose">Close</button>
	</dialog>

	<pre id="graph" aria-label="Graph" class="mermaid"></pre>

	<footer>Based on <a href="https://github.com/SailorMax/mongraph">mongraph</a></footer>
</body>
</html>
