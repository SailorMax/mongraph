<!DOCTYPE html>
<html lang="en">
<head>
	<title>Mongraph</title>
	<link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
	<link rel="stylesheet" href="/static/app.css" />
	<link rel="stylesheet" href="/static/mermaid.css" />
	<script src="/static/mermaid.min.js"></script>
	<script type="module" src="/static/app.js"></script>
</head>

<body>
	<header>
		<div class="centered">
			<div class="refresh_status">
				<div id="refresh_control"><span id="timer">5</span> seconds until refresh <button>stop</button></div>
				<span id="loader"></span>
			</div>
			<h1><!-- Project name --></h1>

			<div class="history_box">
				<table id="history" aria-label="History" class="history">
				<thead>
				<tr>
					<th>Timestamp</th>
					<th>
						Node
						<input id="history-filter" type="text" placeholder="filter the list" />
					</th>
					<th>
						Message
						<button id='history-resizer'>↕</button>
					</th>
				</tr>
				</thead>
				<tbody>
				</tbody>
				</table>
			</div>

			<nav id="breadcrumb" aria-label="Breadcrumb" class="breadcrumb">
				<ol></ol>
			</nav>
		</div>
	</header>

	<pre id="graph" aria-label="Graph" class="mermaid"></pre>
</body>
</html>
